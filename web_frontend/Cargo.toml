[package]
name = "web_frontend"
version = "0.1.0"
edition = "2021"


[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
yew-router = "0.20.0"
serde_json = "1.0.154"
num-format = "0.4.4"
serde = { version = "1.0.229", features = ["derive"] }
gloo-utils = "0.3.0"
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
wasm-bindgen-futures = "0.4.80"
futures = "0.3.34"
log = "0.4.35"
wasm-logger = "0.2.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde-tuple-vec-map = "1.0.1"
web-sys = { version = "0.3.107", features = ["InputEvent",  "InputEventInit", "HtmlSelectElement", "Window", "Location", "Clipboard", "Navigator", "SubmitEvent", "KeyboardEvent", "DomTokenList"]}
gloo-net = "0.7.0"
serde_with = "3.24.0"
url = "2.5.8"
readonly = "0.2.14"
thiserror = "2.0.21"
filterlists-api = { path = "../filterlists-api" }
regex = "1.13.1"
