[package]
name = "web_frontend"
version = "0.1.0"
edition = "2021"


[dependencies]
yew = { version = "0.23", features = ["csr"] }
yew-router = "0.20"
serde_json = "1.0.81"
num-format = "0.4.0"
serde = { version = "1.0.137", features = ["derive"] }
gloo-utils = "0.3"
wasm-bindgen = "0.2.125"
wasm-bindgen-futures = "0.4"
futures = "0.3.21"
log = "0.4.17"
wasm-logger = "0.2.0"
gloo-timers = { version = "0.4", features = ["futures"] }
serde-tuple-vec-map = "1.0.1"
web-sys = { version = "0.3.77", features = ["InputEvent",  "InputEventInit", "HtmlSelectElement", "Window", "Location", "Clipboard", "Navigator", "SubmitEvent", "KeyboardEvent"]}
gloo-net = "0.6"
serde_with = "3.8.1"
url = "2.5.0"
readonly = "0.2.12"
thiserror = "2"
filterlists-api = { path = "../filterlists-api" }
regex = "1.10.5"
