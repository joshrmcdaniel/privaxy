[package]
name = "privaxy"
description = "Next generation tracker and advertisement blocker"
version = "0.7.1"
edition = "2021"
authors = [
  "Pierre Barre <pierre@barre.sh>",
  "Josh McDaniel <80354972+joshrmcdaniel@users.noreply.github.com>"
]

[package.metadata.deb]
maintainer = "Josh McDaniel <80354972+joshrmcdaniel@users.noreply.github.com>"
license-file = ["../LICENSE.txt", "4"]
maintainer-scripts = "debian/"
depends = "$auto"
assets = [
  ["debian/privaxy.service", "/lib/systemd/system/privaxy.service", "644"],
  ["target/release/privaxy", "/usr/bin/", "755"],
]

[package.metadata.deb.variants.mipsel]
name = "privaxy"
depends = "libc6, libgcc-s1, libatomic1"

[package.metadata.deb.variants.mips]
name = "privaxy"
depends = "libc6, libgcc-s1, libatomic1"

[package.metadata.generate-rpm]
license = "AGPL-3.0-or-later"
summary = "Next generation tracker and advertisement blocker"
assets = [
  { source = "target/release/privaxy", dest = "/usr/bin/privaxy", mode = "755" },
  { source = "debian/privaxy.service", dest = "/lib/systemd/system/privaxy.service", mode = "644" },
  { source = "../LICENSE.txt", dest = "/usr/share/licenses/privaxy/LICENSE.txt", mode = "644", doc = true },
]
pre_install_script = "rpm/preinstall"
post_install_script = "rpm/postinstall"
pre_uninstall_script = "rpm/preuninstall"
post_uninstall_script = "rpm/postuninstall"

[package.metadata.generate-rpm.requires]
systemd = "*"

[[bin]]
name = "privaxy"
path = "src/server/main.rs"

[lib]
name = "privaxy"
path = "src/server/lib.rs"

[dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = [
  "client-legacy",
  "server-auto",
  "server-graceful",
  "service",
  "tokio",
  "http1",
  "http2",
] }
http-body-util = "0.1"
tokio = { version = "1.22.0", features = ["full"] }
serde_json = "1.0.89"
toml = "1"
serde = { version = "1.0.148", features = ["derive"] }
tokio-util = { version = "0.7.4", features = ["full"] }
tokio-stream = "0.1"
bytes = "1"
socket2 = "0.5"
adblock = { version = "0.12.5" }
openssl = { version = "0.10.43", features = ["vendored"] }
include_dir = "0.7.3"
chrono = { version = "0.4.23", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
futures-util = "0.3.25"
wildmatch = "2.1.1"
http = "1"
mime_guess = "2.0.4"
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "native-tokio",
  "tls12",
  "logging",
] }
log = "0.4.17"
env_logger = "0.11.10"
uluru = "3.1.0"
regex = "1.7.0"
lazy_static = "1.4.0"
lol_html = "1.2.1"
crossbeam-channel = "0.5.6"
thiserror = "2"
url = "2.3.1"
futures = "0.3.25"
dirs = "6"
async-compression = { version = "0.4.42", features = ["futures-io", "gzip"] }
reqwest = { version = "0.13", default-features = false, features = [
  "charset",
  "http2",
  "stream",
  "rustls-no-provider",
  "gzip",
  "deflate",
  "json",
  "brotli",
] }
once_cell = "1.16.0"
serde-tuple-vec-map = "1.0.1"
base64 = "0.22.1"
warp = { version = "0.4", features = ["server", "websocket"] }
sha2 = "0.10.8"
hex = "0.4.3"
serde_with = "3.21"
tera = { version = "1", default-features = false }
argon2 = { version = "0.5", features = ["std"] }
hmac = "0.12"
filterlists-api = { path = "../filterlists-api", features = ["reqwest"] }

# getrandom 0.3 (pulled in via warp -> tokio-tungstenite -> rand) selects a
# backend that calls the libc `getrandom()` wrapper on mips{,el}-unknown-linux-gnu,
# but the MIPS cross-toolchain's pre-2.25 glibc doesn't export it, so the binary
# fails to link. For just these targets we switch getrandom to its `custom`
# backend (`.cargo/config.toml`) and implement it via the raw SYS_getrandom
# syscall in `lib.rs`. These deps exist only to name `getrandom::Error` and call
# `libc::syscall` from that backend.
[target.'cfg(all(target_os = "linux", target_arch = "mips", target_env = "gnu"))'.dependencies]
getrandom = "0.3"
libc = "0.2"