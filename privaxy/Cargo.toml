[package]
name = "privaxy"
description = "Next generation tracker and advertisement blocker"
version = "0.8.1"
edition = "2021"
repository = "https://github.com/joshrmcdaniel/privaxy"
authors = [
  "Pierre Barre <pierre@barre.sh>",
  "Josh McDaniel <80354972+joshrmcdaniel@users.noreply.github.com>"
]

[package.metadata.deb]
maintainer = "Josh McDaniel <80354972+joshrmcdaniel@users.noreply.github.com>"
license-file = ["../LICENSE.txt", "4"]
maintainer-scripts = "debian/"
depends = "$auto"
assets = [
  ["debian/privaxy.service", "/lib/systemd/system/privaxy.service", "644"],
  ["target/release/privaxy", "/usr/bin/", "755"],
]

[package.metadata.deb.variants.mipsel]
name = "privaxy"
depends = "libc6, libgcc-s1, libatomic1"

[package.metadata.deb.variants.mips]
name = "privaxy"
depends = "libc6, libgcc-s1, libatomic1"

[package.metadata.generate-rpm]
license = "AGPL-3.0-or-later"
summary = "Next generation tracker and advertisement blocker"
assets = [
  { source = "target/release/privaxy", dest = "/usr/bin/privaxy", mode = "755" },
  { source = "debian/privaxy.service", dest = "/lib/systemd/system/privaxy.service", mode = "644" },
  { source = "../LICENSE.txt", dest = "/usr/share/licenses/privaxy/LICENSE.txt", mode = "644", doc = true },
]
pre_install_script = "rpm/preinstall"
post_install_script = "rpm/postinstall"
pre_uninstall_script = "rpm/preuninstall"
post_uninstall_script = "rpm/postuninstall"

[package.metadata.generate-rpm.requires]
systemd = "*"

[[bin]]
name = "privaxy"
path = "src/server/main.rs"

[lib]
name = "privaxy"
path = "src/server/lib.rs"

[dependencies]
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = [
  "client-legacy",
  "server-auto",
  "server-graceful",
  "service",
  "tokio",
  "http1",
  "http2",
] }
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["full"] }
serde_json = "1.0.154"
semver = "1.0.28"
toml = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = { version = "0.7.20", features = ["full"] }
tokio-stream = "0.1.19"
tower-service = "0.3.3"
bytes = "1.12.1"
socket2 = "0.6.5"
# default-features = false only to drop `single-thread`: the multi-thread
# engine is Send + Sync, which lets requests share one engine directly instead
# of funneling through a dedicated blocker thread. Restate the other defaults
# and enable debug metadata for per-list rule rejection diagnostics.
adblock = { version = "0.13.5", default-features = false, features = [
  "embedded-domain-resolver",
  "full-regex-handling",
  "debug-info", # Per-list parse diagnostics.
] }
openssl = { version = "0.10.82", features = ["vendored"] }
include_dir = "0.7.4"
chrono = { version = "0.4.45", features = ["serde"] }
rustls = { version = "0.23.46", default-features = false, features = [
  "ring",
  "logging",
  "std",
  "tls12",
] }
futures-util = "0.3.34"
wildmatch = "2.7.0"
http = "1.5.0"
mime_guess = "2.0.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
hyper-rustls = { version = "0.27.10", default-features = false, features = [
  "http1",
  "http2",
  "ring",
  "native-tokio",
  "tls12",
  "logging",
] }
log = "0.4.35"
env_logger = "0.11.11"
uluru = "3.1.0"
portable-atomic = "1.15.0"
regex = "1.13.1"
lazy_static = "1.5.1"
lol_html = "3.0.3"
thiserror = "2.0.21"
url = "2.5.8"
futures = "0.3.34"
async-compression = { version = "0.4.52", features = ["futures-io", "gzip"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "charset",
  "http2",
  "stream",
  "rustls-no-provider",
  "gzip",
  "deflate",
  "json",
  "brotli",
] }
once_cell = "1.21.4"
serde-tuple-vec-map = "1.0.1"
base64 = "0.23.1"
warp = { version = "0.4.4", features = ["server", "websocket"] }
sha2 = "0.11.1"
hex = "0.4.3"
serde_with = "3.24.0"
tera = { version = "2.4.0", default-features = false }
argon2 = "0.6.0"
hmac = "0.13.0"
filterlists-api = { path = "../filterlists-api", features = ["reqwest"] }
# redb 4.3+ unconditionally imports libc::flock64 on GNU/Linux, but libc
# does not expose that type on MIPS. Keep the last compatible release until
# upstream fixes the range-lock backend; 4.2 retains the v3 database format.
redb = "=4.2.0"

[dev-dependencies]
h2 = "0.4.20"

# getrandom 0.3/0.4 call the libc `getrandom()` wrapper on
# mips{,el}-unknown-linux-gnu, but the cross-toolchain's pre-2.25 glibc doesn't
# export it, so the binary fails to link. For these targets we use its `custom`
# backend (`.cargo/config.toml`) and implement it via the raw SYS_getrandom
# syscall in `lib.rs`. These deps exist only to name `getrandom::Error` and call
# `libc::syscall` from that backend.
[target.'cfg(all(target_os = "linux", target_arch = "mips", target_env = "gnu"))'.dependencies]
getrandom = "0.4.3"
libc = "0.2.191"
