name: CI
# See https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # cargo-generate-rpm 0.21.0 has prebuilts for both x86_64 and aarch64.
  PACKAGING_TOOLS: cargo-deb@3.8.0,cargo-generate-rpm@0.21.0

jobs:
  clippy_check:
    name: Run clippy check
    needs: [build_frontend]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: clippy

      # Frontend dist/ must exist for the server's include_dir! to compile.
      # Reuses the artifact produced by the `build_frontend` job.
      - name: Download prebuilt web frontend
        uses: actions/download-artifact@v4
        with:
          name: web_frontend-dist
          path: web_frontend/dist

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: .

  rustfmt:
    name: Check style
    needs: [image_meta]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check
  image_meta:
    name: Validate version and compute image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_name: ${{ steps.vars.outputs.image_name }}
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("privaxy/Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          ref = os.environ["GITHUB_REF"]
          if ref.startswith("refs/tags/v"):
              tag_version = ref.removeprefix("refs/tags/v")
              if tag_version != version:
                  print(f"::error::Release tag v{tag_version} does not match privaxy/Cargo.toml version {version}")
                  raise SystemExit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"package_version={version}", file=output)
          PY

      - name: Get image tag
        id: vars
        run: |
          rel="${GITHUB_REF#refs/*/}"
          if [[ "$rel" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]] ; then
            tag="${rel#v}"
          elif [ "$rel" = "develop" ]; then
            tag="dev"
          elif [ "$rel" = "main" ]; then
            tag="latest"
          else
            tag="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "Using $tag as image tag"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/joshrmcdaniel/privaxy" >> "$GITHUB_OUTPUT"

  image_build:
    name: Build docker image (${{ matrix.platform }})
    needs: [image_meta, ci]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cache_scope: docker-amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cache_scope: docker-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: privaxy-${{ matrix.target }}
          path: ./prebuilt

      - name: Stage prebuilt binary at build-context root
        run: |
          mv ./prebuilt/privaxy ./privaxy-prebuilt
          chmod +x ./privaxy-prebuilt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.image_meta.outputs.image_name }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_MODE=prebuilt
            PREBUILT_BINARY=privaxy-prebuilt
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          # PRs validate the image build without publishing to the registry.
          outputs: ${{ github.event_name == 'push' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', needs.image_meta.outputs.image_name) || 'type=cacheonly' }}

      - name: Export digest
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image_merge:
    name: Merge multi-arch manifest
    needs: [image_meta, image_build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ needs.image_meta.outputs.image_name }}
          IMAGE_TAG: ${{ needs.image_meta.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_NAME: ${{ needs.image_meta.outputs.image_name }}
          IMAGE_TAG: ${{ needs.image_meta.outputs.image_tag }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
  # Builds the Yew/WASM frontend once and uploads `web_frontend/dist/` as an
  # artifact. Every downstream Rust build job downloads it and places it back
  # at `web_frontend/dist/` so the server's `include_dir!` can pick it up.
  # The frontend output is platform-agnostic
  build_frontend:
    name: Build web frontend
    needs: [rustfmt]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + wasm target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: build-frontend

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json
      - name: Install node packages
        working-directory: ./web_frontend
        run: npm ci

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build web frontend
        run: trunk build --release
        working-directory: ./web_frontend

      # Preprocess uBlock scriptlets into the JSON form expected by adblock-rust.
      # This is normally done by privaxy/build.rs via Node, but the cross-rs
      # containers used by the MIPS jobs don't have Node. Running it here lets
      # downstream jobs skip Node entirely — build.rs picks up the file from
      # privaxy/prebuilt/ if present.
      - name: Preprocess uBlock scriptlets
        working-directory: ./privaxy
        run: |
          mkdir -p prebuilt
          node build-scriptlets.mjs \
            src/resources/vendor/ublock/scriptlets.js \
            prebuilt/scriptlets-resources.json

      - name: Upload web_frontend/dist
        uses: actions/upload-artifact@v4
        with:
          name: web_frontend-dist
          path: web_frontend/dist
          if-no-files-found: error
          retention-days: 1

      - name: Upload prebuilt scriptlets resource
        uses: actions/upload-artifact@v4
        with:
          name: scriptlets-resources
          path: privaxy/prebuilt/scriptlets-resources.json
          if-no-files-found: error
          retention-days: 1

  ci:
    name: Build
    needs: [rustfmt, build_frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-gnu
          - build: linux
            os: ubuntu-22.04-arm
            rust: stable
            target: aarch64-unknown-linux-gnu
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: linux
            os: ubuntu-22.04-arm
            rust: stable
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-${{ matrix.target }}

      - name: Install cross build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Install musl build dependencies
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Download prebuilt web frontend
        uses: actions/download-artifact@v4
        with:
          name: web_frontend-dist
          path: web_frontend/dist

      - name: Download prebuilt scriptlets resource
        uses: actions/download-artifact@v4
        with:
          name: scriptlets-resources
          path: privaxy/prebuilt

      - name: Build server
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }} --bin privaxy --target-dir target

      - name: Install packaging tools
        if: ${{ !endsWith(matrix.target, '-musl') }}
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.PACKAGING_TOOLS }}

      - name: Build packages
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: |
          # target/ is cached; discard packages from previous versions.
          rm -f target/${{ matrix.target }}/release/privaxy_*.deb \
                target/${{ matrix.target }}/release/privaxy-*.rpm
          cargo deb --no-build -p privaxy --target ${{ matrix.target }} -o target/${{ matrix.target }}/release
          cargo generate-rpm -p privaxy --target ${{ matrix.target }} -o target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v4
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          name: privaxy-deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/privaxy_*.deb
      - uses: actions/upload-artifact@v4
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          name: privaxy-rpm-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/privaxy-*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: privaxy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/privaxy

  # MIPS targets are tier-3 in rustc as of 1.72
  ci_mips:
    name: Build (MIPS)
    needs: [rustfmt, build_frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            target: mipsel-unknown-linux-gnu
          - build: linux
            os: ubuntu-22.04
            target: mipsel-unknown-linux-musl
          - build: linux
            os: ubuntu-22.04
            target: mips-unknown-linux-musl
          - build: linux
            os: ubuntu-22.04
            target: mips-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: mips-${{ matrix.target }}-${{ hashFiles('Cross.toml') }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Download prebuilt web frontend
        uses: actions/download-artifact@v4
        with:
          name: web_frontend-dist
          path: web_frontend/dist

      - name: Download prebuilt scriptlets resource
        uses: actions/download-artifact@v4
        with:
          name: scriptlets-resources
          path: privaxy/prebuilt

      - name: Build server
        run: cross build --release --target ${{ matrix.target }} --bin privaxy --target-dir target

      - name: Install packaging tools
        if: ${{ endsWith(matrix.target, '-linux-gnu') }}
        uses: taiki-e/install-action@v2
        with:
          tool: ${{ env.PACKAGING_TOOLS }}

      - name: Build packages
        if: ${{ endsWith(matrix.target, '-linux-gnu') }}
        run: |
          # target/ is cached; discard packages from previous versions.
          rm -f target/${{ matrix.target }}/release/privaxy_*.deb \
                target/${{ matrix.target }}/release/privaxy-*.rpm
          variant=$(echo "${{ matrix.target }}" | cut -d- -f1)
          cargo deb --no-build --no-strip --variant "$variant" -p privaxy --target ${{ matrix.target }} -o target/${{ matrix.target }}/release
          cargo generate-rpm -p privaxy --target ${{ matrix.target }} -o target/${{ matrix.target }}/release

      - uses: actions/upload-artifact@v4
        if: ${{ endsWith(matrix.target, '-linux-gnu') }}
        with:
          name: privaxy-deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/privaxy_*.deb

      - uses: actions/upload-artifact@v4
        if: ${{ endsWith(matrix.target, '-linux-gnu') }}
        with:
          name: privaxy-rpm-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/privaxy-*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: privaxy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/privaxy

  release:
    name: Create GitHub Release
    needs: [image_meta, ci, ci_mips, image_merge]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: privaxy-*
          merge-multiple: false
      - name: Flatten artifacts for release
        env:
          PKG_VERSION: ${{ needs.image_meta.outputs.package_version }}
        run: |
          mkdir ./release-assets
          for dir in ./artifacts/privaxy-*/; do
            [ -f "$dir/privaxy" ] || continue
            target=$(basename "$dir" | sed 's/^privaxy-//')
            cp "$dir/privaxy" "./release-assets/privaxy-${PKG_VERSION}-${target}"
          done
          find ./artifacts -name '*.deb' -exec cp {} ./release-assets/ \;
          find ./artifacts -name '*.rpm' -exec cp {} ./release-assets/ \;

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE.md
          files: ./release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
