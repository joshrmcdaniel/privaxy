name: CI
# See https://help.github.com/en/actions/reference/events-that-trigger-workflows
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  clippy_check:
    name: Run clippy check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          components: clippy
          override: true

      - name: Install webassembly rust target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          key: clippy-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            clippy-${{ runner.os }}-
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target

      - name: Install trunk
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: --locked --debug trunk

      # Required for tailwindcss
      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install node packages
        working-directory: ./web_frontend
        run: npm i

      # Frontend dist/ must exist for the server's include_dir! to compile.
      - name: Build web frontend
        run: trunk build
        working-directory: ./web_frontend

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: .

  rustfmt:
    name: Check style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          profile: minimal
          override: true

      - name: Run cargo fmt
        uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check
  image_meta:
    name: Compute image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Get image tag
        id: vars
        run: |
          rel="${GITHUB_REF#refs/*/}"
          if grep -qE '^\d+\.\d+\.\d+' <<< "$rel" ; then
            tag="$rel"
          elif [ "$rel" = "main" ]; then
            tag="dev"
          else
            tag="$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          echo "Using $tag as image tag"
          echo "image_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image_name=ghcr.io/joshrmcdaniel/privaxy" >> "$GITHUB_OUTPUT"

  image_build:
    name: Build docker image (${{ matrix.platform }})
    needs: [image_meta, ci]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            cache_scope: docker-amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            cache_scope: docker-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download prebuilt binary
        uses: actions/download-artifact@v4
        with:
          name: privaxy-${{ matrix.target }}
          path: ./prebuilt

      - name: Stage prebuilt binary at build-context root
        run: |
          mv ./prebuilt/privaxy ./privaxy-prebuilt
          chmod +x ./privaxy-prebuilt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_MODE=prebuilt
            PREBUILT_BINARY=privaxy-prebuilt
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
          outputs: type=image,name=${{ needs.image_meta.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.cache_scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  image_merge:
    name: Merge multi-arch manifest
    needs: [image_meta, image_build]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE_NAME: ${{ needs.image_meta.outputs.image_name }}
          IMAGE_TAG: ${{ needs.image_meta.outputs.image_tag }}
        run: |
          docker buildx imagetools create \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        env:
          IMAGE_NAME: ${{ needs.image_meta.outputs.image_name }}
          IMAGE_TAG: ${{ needs.image_meta.outputs.image_tag }}
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
  ci:
    name: Build
    needs: [rustfmt]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-gnu
          - build: linux
            os: ubuntu-22.04-arm
            rust: stable
            target: aarch64-unknown-linux-gnu
          - build: linux
            os: ubuntu-22.04
            rust: stable
            target: x86_64-unknown-linux-musl
          - build: linux
            os: ubuntu-22.04-arm
            rust: stable
            target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          key:  ${{ matrix.os }}-${{ matrix.target }}-artifacts
          path: |
            ./target
            ~/.cargo

      - name: Install rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          profile: minimal
          override: true

      - name: Install rust target
        run: rustup target add ${{ matrix.target }}
      - name: Install cross build dependencies
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Install musl build dependencies
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev
      - name: Install node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install node packages
        working-directory: ./web_frontend
        run: npm i
      - name: Install trunk
        uses: actions-rs/cargo@v1
        with:
          command: install
          args: --locked --debug trunk
      - name: Build web frontend
        run: rustup target add wasm32-unknown-unknown && trunk build --release
        working-directory: ./web_frontend
      - name: Build server
        uses: actions-rs/cargo@v1
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        with:
          command: build
          working-directory: .
          args: --release --target ${{ matrix.target }} --bin privaxy --target-dir target
      - name: Build packages
        if: ${{ !endsWith(matrix.target, '-musl') }}
        run: |
          cargo install cargo-deb && cargo deb -p privaxy --target ${{ matrix.target }} -o target/${{ matrix.target }}/release
          cargo install cargo-generate-rpm && cargo generate-rpm -p privaxy --target ${{ matrix.target }} -o target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@v4
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          name: privaxy-deb-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/privaxy_*.deb
      - uses: actions/upload-artifact@v4
        if: ${{ !endsWith(matrix.target, '-musl') }}
        with:
          name: privaxy-rpm-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: privaxy-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/privaxy
