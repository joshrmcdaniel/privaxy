[package]
name = "filterlists-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "filterlists_api"
path = "src/lib.rs"

[dependencies]
readonly = "0.2.12"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls-no-provider",
], optional = true }
reqwasm = { version = "0.5.0", optional = true }
async-trait = "0.1.80"
thiserror = "2"

[features]
default = []
reqwest = ["dep:reqwest"]
reqwasm = ["dep:reqwasm"]
