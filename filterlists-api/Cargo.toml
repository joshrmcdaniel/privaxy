[package]
name = "filterlists-api"
version = "0.1.0"
edition = "2021"

[lib]
name = "filterlists_api"
path = "src/lib.rs"

[dependencies]
readonly = "0.2.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls-no-provider",
], optional = true }
reqwasm = { version = "0.5.0", optional = true }
thiserror = "2.0.21"

[features]
default = []
reqwest = ["dep:reqwest"]
reqwasm = ["dep:reqwasm"]
